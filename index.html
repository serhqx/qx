<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NET_WORM.exe</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;font-family:monospace}
body{background:#050508;color:#0f6;display:flex;justify-content:center;min-height:100vh;margin:0;padding:10px}
.game-layout{display:flex;gap:20px;max-width:900px;width:100%;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:auto}
.container{text-align:center;display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px}
h1{font-size:2.2rem;margin:0 0 5px;text-shadow:0 0 15px rgba(0,255,102,.7)}
.status-text{color:#888;font-size:.85rem;margin-bottom:15px;cursor:pointer}
.status-text:hover{color:#0ff}
.score-container{font-size:2rem;font-weight:bold;margin-bottom:20px;color:#0ff;text-shadow:0 0 20px rgba(0,255,255,.5)}
.click-btn{width:150px;height:150px;border-radius:25px;background:#0f1c14;border:3px dashed #0f6;color:#0f6;font-size:3.5rem;cursor:pointer;outline:none;transition:all .05s;box-shadow:inset 0 0 20px rgba(0,255,102,.2),0 0 30px rgba(0,255,102,.2);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.click-btn:active{transform:scale(.95);border-style:solid;background:#0f6;color:#000;box-shadow:0 0 40px #0f6}
.shop{margin-top:20px;background:rgba(10,25,15,.8);padding:15px;border-radius:10px;border:1px solid #0f6;width:100%}
.shop-title{font-size:1rem;margin-bottom:10px;color:#f05}
.stats{font-size:.85rem;margin-bottom:12px;text-align:left;line-height:1.4}
.upgrade-btn{width:100%;background:transparent;color:#0f6;border:1px solid #0f6;padding:8px;font-size:.85rem;cursor:pointer;font-weight:bold;margin-top:5px}
.upgrade-btn:hover:not(:disabled){background:#0f6;color:#000}
.upgrade-btn:disabled{border-color:#333;color:#333;cursor:not-allowed}
.leaderboard{background:rgba(10,15,25,.8);border:1px solid #0ff;border-radius:10px;padding:15px;width:100%;max-width:340px;box-shadow:0 0 15px rgba(0,255,255,.1)}
.leaderboard-title{font-size:1.1rem;color:#0ff;text-shadow:0 0 10px rgba(0,255,255,.5);margin-bottom:5px;text-align:center;border-bottom:1px dashed #0ff;padding-bottom:5px}
.live{font-size:.7rem;text-align:center;color:#888;margin-bottom:10px}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f05;margin-right:5px}
.live.on i{background:#0f6;box-shadow:0 0 8px #0f6}
.player-row{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;padding:6px 4px;border-bottom:1px solid rgba(0,255,255,.1)}
.player-row.me{color:#0ff;font-weight:bold;background:rgba(0,255,255,.08)}
.player-row:last-child{border:none}
.player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-score{color:#0f6;font-weight:bold}
.gap{text-align:center;color:#555;font-size:.8rem}
.floating-text{position:fixed;font-size:1.5rem;font-weight:bold;color:#0f6;pointer-events:none;animation:floatUp .7s ease-out forwards;text-shadow:0 0 8px #0f6;z-index:5}
@keyframes floatUp{to{opacity:0;transform:translateY(-120px)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.overlay.hidden{display:none}
.modal{background:#0a1410;border:1px solid #0f6;border-radius:10px;padding:20px;width:100%;max-width:320px;text-align:center}
.modal input{width:100%;background:#000;border:1px solid #0ff;color:#0ff;padding:10px;font-size:1rem;margin:12px 0;user-select:text;outline:none}
.modal .err{color:#f05;font-size:.8rem;min-height:1em}
@media (prefers-reduced-motion:reduce){.floating-text{animation-duration:.01s}}
</style>
</head>
<body>
<div class="game-layout">
  <div class="container">
    <h1>NET_WORM.exe</h1>
    <div class="status-text" id="userStatus" title="Змінити нікнейм"></div>
    <div class="score-container">Заражено ПК: <span id="score">0</span></div>
    <button class="click-btn" id="clickerBtn" aria-label="Клік">🌐</button>
    <div class="shop">
      <div class="shop-title">&gt;_ Модулі</div>
      <div class="stats">• Атака: +<span id="clickPower">1</span> ПК/клік<br>• Авто-злам: +<span id="passivePower">0</span> ПК/сек<br>• Софт: <span id="virusLevel">Trojan.v1</span></div>
      <button class="upgrade-btn" id="upgradeBtn"></button>
      <button class="upgrade-btn" id="botnetBtn"></button>
    </div>
  </div>
  <div class="leaderboard">
    <div class="leaderboard-title">&gt;_ ОНЛАЙН ТОП</div>
    <div class="live" id="live"><i></i><span>Підключення...</span></div>
    <div id="leaderboardContent"></div>
  </div>
</div>

<div class="overlay hidden" id="nameOverlay">
  <div class="modal">
    <div>Введіть нікнейм для рейтингу</div>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Nickname">
    <div class="err" id="nameErr"></div>
    <button class="upgrade-btn" id="nameOk">Увійти в мережу</button>
  </div>
</div>

<script>
// ===== НАЛАШТУВАННЯ =====
// Вставте URL вашої Firebase Realtime Database (без слеша в кінці), напр.:
// https://my-game-default-rtdb.europe-west1.firebasedatabase.app
const DB_URL = "https://YOUR-PROJECT-default-rtdb.firebaseio.com";
const TOP_N = 10;
const SEND_DELAY = 400; // мс між відправками рахунку (для швидкого оновлення)
// ========================

const virusNames = ["Trojan.v1","Spyware.dll","NetWorm.x64","Rootkit.sys","Ransom.Crypto","AI.Infection"];
const $ = id => document.getElementById(id);
const cleanName = s => (s || "").replace(/[.#$\/\[\]\s]+/g, "_").substring(0, 12).replace(/^_+|_+$/g, "");
const load = (k, d) => { try { const v = parseInt(localStorage.getItem(k)); return isNaN(v) ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let username = "";
try { username = cleanName(localStorage.getItem('v_un')); } catch (e) {}

let score = load('v_sc', 0), clickPower = load('v_cp', 1), upgradeCost = load('v_uc', 10),
    passivePower = load('v_pp', 0), botnetCost = load('v_bc', 50);

let players = {};          // name -> score (дані з сервера)
let renderQueued = false;

/* ---------- Нікнейм ---------- */
function askName(initial, cb) {
  const ov = $('nameOverlay'), inp = $('nameInput'), err = $('nameErr');
  inp.value = initial || ""; err.textContent = ""; ov.classList.remove('hidden'); inp.focus();
  const done = () => {
    const n = cleanName(inp.value);
    if (n.length < 2) { err.textContent = "Мінімум 2 символи (літери/цифри)"; return; }
    ov.classList.add('hidden'); $('nameOk').onclick = null; inp.onkeydown = null; cb(n);
  };
  $('nameOk').onclick = done;
  inp.onkeydown = e => { if (e.key === 'Enter') done(); };
}
function showName() { $('userStatus').textContent = `Хакер: ${username} ✏️`; }
$('userStatus').onclick = () => askName(username, n => {
  if (n === username) return;
  const old = username; username = n; store2('v_un', n); showName();
  delete players[old];
  fetch(`${DB_URL}/players/${encodeURIComponent(old)}.json`, { method: 'DELETE' }).catch(() => {});
  players[username] = score; sendNow(); queueRender();
});
function store2(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- Інтерфейс ---------- */
function updateUI() {
  $('score').textContent = score.toLocaleString();
  $('clickPower').textContent = clickPower;
  $('passivePower').textContent = passivePower;
  $('virusLevel').textContent = virusNames[Math.min(Math.floor((clickPower + passivePower) / 6), virusNames.length - 1)];
  $('upgradeBtn').textContent = `Мутувати код (Ціна: ${upgradeCost})`;
  $('upgradeBtn').disabled = score < upgradeCost;
  $('botnetBtn').textContent = `Ботнет-мережа (Ціна: ${botnetCost})`;
  $('botnetBtn').disabled = score < botnetCost;
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store('v_sc', score); store('v_cp', clickPower); store('v_uc', upgradeCost);
    store('v_pp', passivePower); store('v_bc', botnetCost);
  }, 300);
}

/* ---------- Лідерборд: миттєве відображення ---------- */
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderBoard(); });
}
function row(rank, name, sc, me) {
  const r = document.createElement('div');
  r.className = 'player-row' + (me ? ' me' : '');
  const a = document.createElement('span'); a.className = 'player-name';
  a.textContent = `${rank}. ${name}${me ? ' (Ви)' : ''}`;   // textContent — захист від XSS
  const b = document.createElement('span'); b.className = 'player-score';
  b.textContent = sc.toLocaleString();
  r.append(a, b); return r;
}
function renderBoard() {
  const box = $('leaderboardContent');
  const all = { ...players };
  if (username) all[username] = score;      // ваш рахунок завжди локальний = оновлюється на кожен клік
  const list = Object.entries(all).map(([n, s]) => ({ n, s: Number(s) || 0 })).sort((a, b) => b.s - a.s);
  box.textContent = '';
  if (!list.length) { box.textContent = 'Мережа чиста.'; return; }
  list.slice(0, TOP_N).forEach((p, i) => box.appendChild(row(i + 1, p.n, p.s, p.n === username)));
  const myIdx = list.findIndex(p => p.n === username);
  if (myIdx >= TOP_N) {
    const g = document.createElement('div'); g.className = 'gap'; g.textContent = '...'; box.appendChild(g);
    box.appendChild(row(myIdx + 1, username, score, true));
  }
}

/* ---------- Відправка рахунку ---------- */
let sendTimer = null, sending = false, dirty = false;
function queueSend() {
  dirty = true;
  if (sendTimer || sending) return;
  sendTimer = setTimeout(() => { sendTimer = null; sendNow(); }, SEND_DELAY);
}
async function sendNow() {
  if (!username || sending) { dirty = true; return; }
  sending = true; dirty = false;
  try {
    await fetch(`${DB_URL}/players/${encodeURIComponent(username)}.json`, {
      method: 'PUT', body: JSON.stringify({ name: username, score })
    });
  } catch (e) { dirty = true; }
  sending = false;
  if (dirty) queueSend();
}

/* ---------- Realtime-стрім (Server-Sent Events) ---------- */
function applyEvent(type, msg) {
  let d; try { d = JSON.parse(msg.data); } catch (e) { return; }
  if (!d) return;
  const path = d.path, data = d.data, parts = path.split('/').filter(Boolean);
  const val = v => (v && typeof v === 'object') ? Number(v.score) || 0 : Number(v) || 0;
  if (parts.length === 0) {
    if (type === 'put') players = {};
    Object.entries(data || {}).forEach(([k, v]) => { if (v !== null) players[k] = val(v); else delete players[k]; });
  } else if (parts.length === 1) {
    if (data === null) delete players[parts[0]]; else players[parts[0]] = val(data);
  } else if (parts[1] === 'score') {
    players[parts[0]] = Number(data) || 0;
  }
  queueRender();
}
let es;
function connect() {
  if (DB_URL.includes("YOUR-PROJECT")) {
    $('live').lastChild.textContent = "Вкажіть DB_URL у скрипті";
    return;
  }
  es = new EventSource(`${DB_URL}/players.json`);
  es.addEventListener('put', e => applyEvent('put', e));
  es.addEventListener('patch', e => applyEvent('patch', e));
  es.onopen = () => { $('live').classList.add('on'); $('live').lastChild.textContent = 'LIVE'; };
  es.onerror = () => { $('live').classList.remove('on'); $('live').lastChild.textContent = 'Перепідключення...'; };
}

/* ---------- Ігрова логіка ---------- */
function floatText(x, y, text) {
  const el = document.createElement('div');
  el.className = 'floating-text'; el.textContent = text;
  el.style.left = (x - 20) + 'px'; el.style.top = (y - 20) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 700);
}
function changed() { updateUI(); save(); queueSend(); queueRender(); }

$('clickerBtn').addEventListener('click', e => {
  score += clickPower;
  changed();
  const x = e.clientX || $('clickerBtn').getBoundingClientRect().left + 75;
  const y = e.clientY || $('clickerBtn').getBoundingClientRect().top + 75;
  floatText(x, y, `${Math.random() > .5 ? '1' : '0'} (+${clickPower})`);
});
$('upgradeBtn').addEventListener('click', () => {
  if (score < upgradeCost) return;
  score -= upgradeCost; clickPower += 2; upgradeCost = Math.round(upgradeCost * 1.7); changed();
});
$('botnetBtn').addEventListener('click', () => {
  if (score < botnetCost) return;
  score -= botnetCost; passivePower += 5; botnetCost = Math.round(botnetCost * 1.8); changed();
});
setInterval(() => { if (passivePower > 0) { score += passivePower; changed(); } }, 1000);
window.addEventListener('beforeunload', () => { store('v_sc', score); });

/* ---------- Старт ---------- */
function start() { showName(); updateUI(); renderBoard(); connect(); if (score > 0) sendNow(); }
if (username.length >= 2) start();
else askName("", n => { username = n; store2('v_un', n); start(); });
</script>
</body>
</html>
