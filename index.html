<!DOCTYPE html>
<html>
<head>
  <title>Free Virus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      cursor: pointer;
      user-select: none; /* Забороняємо виділення тексту при швидких кліках */
    }

    #main {
      position: fixed;
      inset: 0;
      display: flex; /* Екран тепер відкритий одразу */
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;

      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)),
        url("background.jpg") center/cover no-repeat;
    }

    .profile h1 {
      margin: 0;
      font-size: 48px;
    }

    .profile p {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 5px;
    }

    /* Стилі для спільного лічильника */
    #click-counter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none; /* Кліки проходять крізь плашку */
    }

    #counter-value {
      font-weight: bold;
      color: #00ff00; /* Зелений колір для кліків */
    }
  </style>
</head>

<body>

  <!-- Головний екран, який показується відразу -->
  <div id="main">
    <div class="profile">
      <h1>serh (!)</h1>
      <p>s a m e s h i t / d i f f e r e n t d a y</p>
    </div>
  </div>

  <!-- Віджет спільного лічильника -->
  <div id="click-counter">
    CLICKS: <span id="counter-value">Loading...</span>
  </div>

  <script>
    // Заміни це посилання на своє з Firebase (як описано в попередньому кроці)
    const dbUrl = "https://ТВІЙ_ПРОЄКТ_З_://firebaseio.com";

    const counterValue = document.getElementById("counter-value");
    let currentTotal = 0;

    // Функція отримання кліків з сервера
    function fetchClicks() {
      fetch(dbUrl)
        .then(response => response.json())
        .then(data => {
          currentTotal = data !== null ? data : 0;
          counterValue.textContent = currentTotal;
        })
        .catch(err => console.error("Помилка завантаження:", err));
    }

    // Перше завантаження при старті
    fetchClicks();

    // Оновлюємо базу кожні 2 секунди для синхронізації між усіма людьми
    setInterval(fetchClicks, 2000);

    // Клік у будь-якому місці екрана
    document.body.onclick = function() {
      currentTotal++;
      counterValue.textContent = currentTotal;

      // Відправляємо новий клік в онлайн-базу
      fetch(dbUrl, {
        method: 'PUT',
        body: JSON.stringify(currentTotal),
        headers: {
          'Content-Type': 'application/json'
        }
      }).catch(err => console.error("Помилка відправки:", err));
    };
  </script>

</body>
</html>
