<!DOCTYPE html>
<html>
<head>
  <title>Free Virus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      cursor: pointer; /* Робимо курсор у вигляді вказівника для кліків */
    }

    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
      z-index: 10;
      letter-spacing: 3px;
      font-size: 15px;
    }

    #main {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;

      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)),
        url("background.jpg") center/cover no-repeat;
    }

    .profile h1 {
      margin: 0;
      font-size: 48px;
    }

    .profile p {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 5px;
    }

    /* Стилі для нашого нового лічильника */
    #click-counter {
      display: none; /* Спочатку ховаємо його, поки не клікнули перший раз */
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none; /* Щоб плашка не блокувала кліки мишкою */
    }

    #counter-value {
      font-weight: bold;
      color: #00ff00; /* Робимо цифру зеленою під стиль хакерства */
    }
  </style>
</head>

<body>

  <!-- Початковий екран -->
  <div id="enter">click for free virus</div>

  <!-- Головний екран (з'явиться після кліку) -->
  <div id="main">
    <div class="profile">
      <h1>serh (!)</h1>
      <p>s a m e s h i t / d i f f e r e n t d a y</p>
    </div>
  </div>

  <!-- Елемент лічильника кліків -->
  <div id="click-counter">
    CLICKS: <span id="counter-value">0</span>
  </div>

  <script>
    let clickCount = 0;
    const enterScreen = document.getElementById("enter");
    const mainScreen = document.getElementById("main");
    const counterWidget = document.getElementById("click-counter");
    const counterValue = document.getElementById("counter-value");

    // Перший клік: ховаємо заставку, відкриваємо сайт і лічильник
    enterScreen.onclick = function() {
      enterScreen.style.display = "none";
      mainScreen.style.display = "flex";
      counterWidget.style.display = "block";
      
      // Зараховуємо найперший клік
      clickCount++;
      counterValue.textContent = clickCount;
    };

    // Наступні кліки по всьому екрану збільшують лічильник
    document.body.onclick = function() {
      // Працює лише тоді, коли початковий екран уже сховано
      if (enterScreen.style.display === "none") {
        clickCount++;
        counterValue.textContent = clickCount;
      }
    };
  </script>

</body>
</html>
