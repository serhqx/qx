<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>нічний біг</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a08;--panel:rgba(22,24,19,.72);--line:#2a2d26;--txt:#d9dbd3;--mute:#7b7f74;--led:#37ff5e;--lcd:#8fdcff}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Oswald','Arial Narrow',sans-serif;font-weight:300}
body{background:radial-gradient(ellipse at 30% 15%,#1b1e17 0,var(--bg) 70%) fixed;color:var(--txt);display:flex;justify-content:center;min-height:100vh;margin:0;padding:18px 12px 40px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
.layout{display:flex;gap:28px;max-width:960px;width:100%;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:auto}
.main{width:100%;max-width:560px;text-align:center}
h1{font-size:2.6rem;margin:0;color:#fff;font-weight:300}
.status-text{color:var(--mute);font-size:.95rem;margin:2px 0 18px;cursor:pointer}
.status-text:hover{color:var(--led)}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:rgba(10,11,9,.8);touch-action:manipulation;cursor:pointer}
.hint{color:var(--mute);font-size:.9rem;margin-top:10px}
.leaderboard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;width:100%;max-width:340px}
.leaderboard-title{font-size:1.15rem;color:#fff;margin-bottom:4px;font-weight:400}
.live{font-size:.8rem;color:var(--mute);margin-bottom:12px}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7a3b3b;margin-right:6px}
.live.on i{background:var(--led);box-shadow:0 0 8px var(--led)}
.player-row{display:flex;justify-content:space-between;gap:8px;font-size:1rem;padding:7px 6px;border-bottom:1px solid #1c1e19}
.player-row:last-child{border:none}
.player-row.me{color:var(--lcd);background:rgba(143,220,255,.07);border-radius:3px}
.player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-score{font-variant-numeric:tabular-nums}
.gap{text-align:center;color:#4a4d44;font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.overlay.hidden{display:none}
.modal{background:#10120e;border:1px solid var(--line);border-radius:6px;padding:22px;width:100%;max-width:320px;text-align:center;font-size:1.2rem}
.modal input{width:100%;background:#050604;border:1px solid var(--line);color:var(--lcd);padding:11px;font-size:1.1rem;margin:14px 0 6px;user-select:text;outline:none;border-radius:4px}
.modal input:focus{border-color:var(--led)}
.modal .err{color:#e07a7a;font-size:.85rem;min-height:1.2em;margin-bottom:6px}
.btn{width:100%;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:11px;font-size:1rem;cursor:pointer}
.btn:hover{border-color:var(--led);color:#fff}
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <h1>нічний біг</h1>
    <div class="status-text" id="userStatus" title="Змінити нікнейм"></div>
    <canvas id="c" aria-label="Гра"></canvas>
    <div class="hint">торкнись екрана або натисни пробіл, щоб стрибнути</div>
  </div>
  <div class="leaderboard">
    <div class="leaderboard-title">хто добіг далі</div>
    <div class="live" id="live"><i></i><span>підключення...</span></div>
    <div id="leaderboardContent"></div>
  </div>
</div>

<div class="overlay hidden" id="nameOverlay">
  <div class="modal">
    <div>хто ти, нічний гість?</div>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="нікнейм">
    <div class="err" id="nameErr"></div>
    <button class="btn" id="nameOk">бігти</button>
  </div>
</div>

<script>
// ===== НАЛАШТУВАННЯ =====
const DB_URL = "https://serh-1-default-rtdb.firebaseio.com";
const TOP_N = 10, SEND_DELAY = 500;
// ========================
const $ = id => document.getElementById(id);
const cleanName = s => (s || "").replace(/[.#$\/\[\]\s]+/g, "_").substring(0, 12).replace(/^_+|_+$/g, "");
const getI = (k, d) => { try { const v = parseInt(localStorage.getItem(k)); return isNaN(v) ? d : v; } catch (e) { return d; } };
const setI = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let username = ""; try { username = cleanName(localStorage.getItem('v_un')); } catch (e) {}
let best = getI('n_best', 0), cur = 0;
let players = {}, renderQueued = false;

/* ---------- Нікнейм ---------- */
function askName(initial, cb) {
  const ov = $('nameOverlay'), inp = $('nameInput'), err = $('nameErr');
  inp.value = initial || ""; err.textContent = ""; ov.classList.remove('hidden'); inp.focus();
  const done = () => {
    const n = cleanName(inp.value);
    if (n.length < 2) { err.textContent = "мінімум 2 символи"; return; }
    ov.classList.add('hidden'); $('nameOk').onclick = null; inp.onkeydown = null; cb(n);
  };
  $('nameOk').onclick = done;
  inp.onkeydown = e => { if (e.key === 'Enter') done(); };
}
const showName = () => { $('userStatus').textContent = `${username} ✎`; };
$('userStatus').onclick = () => askName(username, n => {
  if (n === username) return;
  const old = username; username = n; try { localStorage.setItem('v_un', n); } catch (e) {}
  showName(); delete players[old];
  fetch(`${DB_URL}/players/${encodeURIComponent(old)}.json`, { method: 'DELETE' }).catch(() => {});
  sendNow(); queueRender();
});

/* ---------- Лідерборд ---------- */
const mine = () => Math.max(best, cur);
function queueRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderBoard(); }); }
function row(rank, name, sc, me) {
  const r = document.createElement('div'); r.className = 'player-row' + (me ? ' me' : '');
  const a = document.createElement('span'); a.className = 'player-name'; a.textContent = `${rank}. ${name}${me ? ' (ти)' : ''}`;
  const b = document.createElement('span'); b.className = 'player-score'; b.textContent = sc.toLocaleString();
  r.append(a, b); return r;
}
function renderBoard() {
  const box = $('leaderboardContent'), all = { ...players };
  if (username) all[username] = mine();
  const list = Object.entries(all).map(([n, s]) => ({ n, s: Number(s) || 0 })).sort((a, b) => b.s - a.s);
  box.textContent = '';
  if (!list.length) { box.textContent = 'поки нікого.'; return; }
  list.slice(0, TOP_N).forEach((p, i) => box.appendChild(row(i + 1, p.n, p.s, p.n === username)));
  const i = list.findIndex(p => p.n === username);
  if (i >= TOP_N) { const g = document.createElement('div'); g.className = 'gap'; g.textContent = '...'; box.appendChild(g); box.appendChild(row(i + 1, username, mine(), true)); }
}
let sendTimer = null, sending = false, dirty = false;
function queueSend() { dirty = true; if (sendTimer || sending) return; sendTimer = setTimeout(() => { sendTimer = null; sendNow(); }, SEND_DELAY); }
async function sendNow() {
  if (!username || sending) { dirty = true; return; }
  sending = true; dirty = false;
  try { await fetch(`${DB_URL}/players/${encodeURIComponent(username)}.json`, { method: 'PUT', body: JSON.stringify({ name: username, score: mine(), ts: { ".sv": "timestamp" } }) }); }
  catch (e) { dirty = true; }
  sending = false; if (dirty) queueSend();
}
function applyEvent(type, msg) {
  let d; try { d = JSON.parse(msg.data); } catch (e) { return; }
  if (!d) return;
  const parts = d.path.split('/').filter(Boolean), data = d.data;
  const val = v => (v && typeof v === 'object') ? Number(v.score) || 0 : Number(v) || 0;
  if (!parts.length) { if (type === 'put') players = {}; Object.entries(data || {}).forEach(([k, v]) => { if (v !== null) players[k] = val(v); else delete players[k]; }); }
  else if (parts.length === 1) { if (data === null) delete players[parts[0]]; else players[parts[0]] = val(data); }
  else if (parts[1] === 'score') players[parts[0]] = Number(data) || 0;
  queueRender();
}
function connect() {
  const st = $('live').lastChild;
  if (DB_URL.includes("YOUR-PROJECT")) { st.textContent = "вкажіть DB_URL"; return; }
  const es = new EventSource(`${DB_URL}/players.json`);
  es.addEventListener('put', e => applyEvent('put', e));
  es.addEventListener('patch', e => applyEvent('patch', e));
  es.onopen = () => { $('live').classList.add('on'); st.textContent = 'live'; };
  es.onerror = () => { $('live').classList.remove('on'); st.textContent = 'перепідключення...'; };
}

/* ---------- Гра ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
const W = 560, H = 190, GROUND = 150, CAT_X = 50;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr; cv.style.aspectRatio = `${W}/${H}`;
ctx.scale(dpr, dpr);

let state = 'idle', dist = 0, speed = 0, catY = 0, vy = 0, obs = [], nextGap = 0, last = 0, deadAt = 0, tick = 0;
const stars = Array.from({ length: 28 }, () => ({ x: Math.random() * W, y: Math.random() * 100, r: Math.random() * 1.2 + .3 }));

function reset() { state = 'run'; dist = 0; speed = 320; catY = 0; vy = 0; obs = []; nextGap = 300; cur = 0; }
function jump() {
  if (!$('nameOverlay').classList.contains('hidden')) return;
  if (state === 'idle') { reset(); return; }
  if (state === 'dead') { if (performance.now() - deadAt > 450) reset(); return; }
  if (catY === 0) vy = 740;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { if (document.activeElement.tagName !== 'INPUT') { e.preventDefault(); jump(); } } });

function die() {
  state = 'dead'; deadAt = performance.now();
  if (cur > best) best = cur;
  setI('n_best', best); cur = 0; queueSend(); queueRender();
}
function update(dt) {
  if (state !== 'run') return;
  const score = Math.floor(dist / 12);
  speed = 320 + Math.min(score * 1.4, 430);
  dist += speed * dt;
  vy -= 2400 * dt; catY += vy * dt;
  if (catY <= 0) { catY = 0; vy = 0; }
  nextGap -= speed * dt;
  if (nextGap <= 0) {
    const n = Math.random() < .3 ? 2 : 1, s = 22 + Math.random() * 16;
    obs.push({ x: W + 20, s, n, seed: Array.from({ length: 7 }, () => [Math.random() * 6.28, Math.random() * 6.28]) });
    nextGap = 330 + Math.random() * 380 + speed * .35;
  }
  obs.forEach(o => o.x -= speed * dt);
  obs = obs.filter(o => o.x > -80);
  const ns = Math.floor(dist / 12);
  if (ns !== cur) { cur = ns; if (cur > best) { queueSend(); } queueRender(); }
  const cl = CAT_X + 6, cr = CAT_X + 34, ct = GROUND - catY - 26, cb = GROUND - catY - 2;
  for (const o of obs) {
    const ol = o.x + 5, or = o.x + o.n * o.s - 5, ot = GROUND - o.s + 5;
    if (cr > ol && cl < or && cb > ot && ct < GROUND) { die(); break; }
  }
}
function drawCat(x, y) {
  const run = state === 'run' && catY === 0, ph = Math.sin(tick * 18) > 0;
  ctx.fillStyle = '#b7a98f';
  ctx.fillRect(x, y - 22, 26, 13);                       // тіло
  ctx.beginPath(); ctx.arc(x + 30, y - 22, 9, 0, 6.28); ctx.fill(); // голова
  ctx.beginPath(); ctx.moveTo(x + 23, y - 28); ctx.lineTo(x + 25, y - 38); ctx.lineTo(x + 30, y - 30); ctx.fill(); // вуха
  ctx.beginPath(); ctx.moveTo(x + 32, y - 30); ctx.lineTo(x + 37, y - 38); ctx.lineTo(x + 39, y - 27); ctx.fill();
  ctx.strokeStyle = '#b7a98f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.quadraticCurveTo(x - 12, y - 20, x - 10, y - 32); ctx.stroke(); // хвіст
  const l1 = run && ph ? 6 : 0, l2 = run && !ph ? 6 : 0;
  ctx.lineWidth = 4; ctx.beginPath();
  ctx.moveTo(x + 5, y - 10); ctx.lineTo(x + 5 - l1 * .5, y - 2 - (catY > 0 ? 5 : l1 ? 3 : 0));
  ctx.moveTo(x + 22, y - 10); ctx.lineTo(x + 22 + l2 * .5, y - 2 - (catY > 0 ? 5 : l2 ? 3 : 0)); ctx.stroke();
  ctx.fillStyle = '#37ff5e'; ctx.shadowColor = '#37ff5e'; ctx.shadowBlur = 8;   // світлодіодні очі
  ctx.beginPath(); ctx.arc(x + 29, y - 23, 1.8, 0, 6.28); ctx.arc(x + 35, y - 23, 1.8, 0, 6.28); ctx.fill();
  ctx.shadowBlur = 0;
}
function drawScribble(x, s, seed) {
  const cx = x + s / 2, cy = GROUND - s / 2, r = s / 2;
  ctx.strokeStyle = '#9aa093'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.28); ctx.stroke();
  ctx.beginPath();
  seed.forEach(([a, b]) => { ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(b) * r, cy + Math.sin(b) * r); });
  ctx.stroke();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#d9dbd3';
  stars.forEach(s => { ctx.globalAlpha = .3 + .3 * Math.sin(tick * 2 + s.x); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill(); });
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#3a3e34'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, GROUND + .5); ctx.lineTo(W, GROUND + .5); ctx.stroke();
  const off = -(dist % 40);
  ctx.fillStyle = '#2a2d26';
  for (let x = off; x < W; x += 40) ctx.fillRect(x, GROUND + 8, 10, 1.5);
  obs.forEach(o => { for (let i = 0; i < o.n; i++) drawScribble(o.x + i * o.s, o.s, o.seed); });
  drawCat(CAT_X, GROUND - catY);
  ctx.textAlign = 'right'; ctx.font = '400 22px Oswald, sans-serif'; ctx.fillStyle = '#8fdcff';
  ctx.fillText(String(cur).padStart(5, '0'), W - 14, 28);
  ctx.font = '300 14px Oswald, sans-serif'; ctx.fillStyle = '#7b7f74';
  ctx.fillText('рекорд ' + String(best).padStart(5, '0'), W - 14, 48);
  ctx.textAlign = 'center';
  if (state !== 'run') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '300 26px Oswald, sans-serif';
    ctx.fillText(state === 'idle' ? 'can i run forever?' : 'ну от.', W / 2, 88);
    ctx.fillStyle = '#7b7f74'; ctx.font = '300 15px Oswald, sans-serif';
    ctx.fillText(state === 'idle' ? 'торкнись, щоб бігти' : 'торкнись, щоб ще раз', W / 2, 114);
  }
}
function loop(t) {
  const dt = Math.min((t - last) / 1000, .05); last = t; tick += dt;
  update(dt); draw(); requestAnimationFrame(loop);
}
addEventListener('beforeunload', () => setI('n_best', best));

function start() { showName(); renderBoard(); connect(); if (best > 0) sendNow(); requestAnimationFrame(t => { last = t; loop(t); }); }
if (username.length >= 2) start();
else askName("", n => { username = n; try { localStorage.setItem('v_un', n); } catch (e) {} start(); });
</script>
</body>
</html>
