<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>serh(!)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=UnifrakturCook:wght@700&family=VT323&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--a:#9b5cff;--g1:#19e6ff;--g2:#ff2d95;--sz:54px;--gap:12px;--rad:16px;--glass:.62;--blur:0px;--dim:0;--cg:.55;--ava:96px;--avr:50%;--wf:"UnifrakturCook",serif;--wfs:clamp(40px,12vw,60px);box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;overflow:hidden}
html.sword,html.sword *{cursor:var(--cur),auto!important}
html.sword.down,html.sword.down *{cursor:var(--cur2),auto!important}
html.ring,html.ring *{cursor:none!important}
#editor,#editor *{cursor:auto!important}
#bg{position:fixed;inset:-24px;background:center/cover no-repeat;filter:blur(var(--blur));transition:transform .25s ease-out;overflow:hidden}
#bv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bv[hidden]{display:none}
#bg::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
#bg::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(transparent,rgba(0,0,0,.6))}
body.noshade #bg::after{display:none}
#fx{position:fixed;inset:0;pointer-events:none}
#crt{position:fixed;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.1) 2px 3px);box-shadow:inset 0 0 130px rgba(0,0,0,.45)}
body.nocrt #crt{display:none}
#head{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:4;text-align:center;pointer-events:none;padding:0 60px}
#wm{position:relative;display:inline-block;margin:0;font-weight:700;font-size:var(--wfs);font-family:var(--wf);letter-spacing:.04em;text-shadow:0 2px 16px rgba(0,0,0,.7)}
#wm::before,#wm::after{content:attr(data-text);position:absolute;inset:0;opacity:.9;display:none}
body.nfx-glitch #wm::before,body.nfx-glitch #wm::after{display:block}
#wm::before{color:var(--g1);animation:g1 4.5s infinite steps(1)}
#wm::after{color:var(--g2);animation:g2 4.5s infinite steps(1)}
body.nfx-glow #wm{text-shadow:0 0 10px var(--a),0 0 30px var(--a),0 0 60px var(--a)}
body.nfx-grad #wm{background:linear-gradient(90deg,var(--a),var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
@keyframes g1{0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}92%{transform:translate(-4px,1px);clip-path:inset(10% 0 55% 0)}96%{transform:translate(3px,-1px);clip-path:inset(60% 0 8% 0)}}
@keyframes g2{0%,91%,100%{transform:none;clip-path:inset(0 0 100% 0)}93%{transform:translate(4px,-1px);clip-path:inset(50% 0 20% 0)}97%{transform:translate(-3px,1px);clip-path:inset(5% 0 70% 0)}}
#loc,#bio,#clock{margin:3px 0 0;font:400 .92rem ui-monospace,Menlo,Consolas,monospace;color:#ecebf6;text-shadow:0 1px 8px #000}
#loc,#clock{color:#c9c6d6;font-size:.82rem}
#bio{min-height:1.3em}
#bio::after{content:"▌";margin-left:2px;color:var(--a);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
[hidden]{display:none!important}
#card{display:contents}
#ava{display:none}
body.card #card{display:flex;flex-direction:column;align-items:center;gap:14px;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(400px,92vw);max-height:90vh;overflow:auto;scrollbar-width:none;padding:28px 18px 22px;background:rgba(8,8,12,var(--cg));border:1px solid rgba(255,255,255,.14);border-radius:calc(var(--rad) + 8px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--a) 22%,transparent)}
body.card #head{position:static;padding:0}
body.card nav,body.card nav.list{position:static;transform:none;width:100%;padding:0;max-height:none;overflow:visible}
body.card.hasava #ava{display:block;width:var(--ava);height:var(--ava);object-fit:cover;border-radius:var(--avr);border:3px solid rgba(255,255,255,.25);box-shadow:0 0 30px color-mix(in srgb,var(--a) 60%,transparent)}
#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);cursor:pointer;transition:opacity .6s,visibility .6s;overflow:auto}
.gw{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;text-align:center}
.gcap{font:400 clamp(46px,15vw,86px)/1 Anton,Impact,"Arial Black",sans-serif;letter-spacing:.02em;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000,0 0 26px color-mix(in srgb,var(--a) 70%,transparent)}
.gimg{width:min(72vw,300px);aspect-ratio:1/1;object-fit:cover;object-position:center top;border:6px solid #fff;border-radius:4px;transform:rotate(-3deg);box-shadow:0 10px 40px rgba(0,0,0,.7),0 0 44px color-mix(in srgb,var(--a) 50%,transparent);animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:rotate(2deg) translateY(-6px)}}
.gs{color:#b7b4c9;font:.95rem ui-monospace,Menlo,Consolas,monospace;animation:bl 1.4s steps(1) infinite}
body.in #gate,body.nogate #gate{opacity:0;visibility:hidden}
nav{position:fixed;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:var(--gap);left:0;right:0;padding:0 16px}
nav.bottom{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
nav.center{top:54%;transform:translateY(-50%)}
nav.top{top:calc(130px + env(safe-area-inset-top,0px))}
nav.list{left:50%;right:auto;width:min(340px,100%);flex-direction:column;flex-wrap:nowrap;max-height:50vh;overflow:auto;scrollbar-width:none;transform:translateX(-50%)}
nav.list.center{transform:translate(-50%,-50%)}
nav a{display:grid;place-items:center;width:var(--sz);height:var(--sz);color:#fff;text-decoration:none;background:rgba(8,8,12,var(--glass));border:1px solid rgba(255,255,255,.18);border-radius:var(--rad);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
body.bs-solid nav a{background:var(--a);border-color:transparent}
body.bs-outline nav a{background:transparent;border:2px solid var(--a);backdrop-filter:none}
nav a:hover,nav a:focus-visible{transform:translateY(-3px);background:color-mix(in srgb,var(--a) 55%,transparent);border-color:var(--a);box-shadow:0 0 22px color-mix(in srgb,var(--a) 60%,transparent);outline:none}
nav svg{width:46%;height:46%;fill:currentColor}
.ci{display:block;width:46%;height:46%;object-fit:contain}
.ci.tint{background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
nav.list a{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;height:auto;min-height:50px;padding:10px 16px;font:600 1rem "Space Grotesk",system-ui,sans-serif}
nav.list svg,nav.list .ci{width:22px;height:22px;flex:none}
body.in nav a,body.nogate nav a{animation:pop .5s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.8)}}
#stickers{position:fixed;inset:0;z-index:1;pointer-events:none}
.st{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;height:auto;border:5px solid #fff;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.55)}
body.sk-clean .st{border:0;border-radius:10px}
body.sk-circle .st{border:3px solid #fff;border-radius:50%;aspect-ratio:1;object-fit:cover}
.fab{position:fixed;z-index:11;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(8,8,12,.6);color:#fff;font-size:18px;backdrop-filter:blur(8px)}
#gear{left:14px;top:calc(14px + env(safe-area-inset-top,0px))}
#share{right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
#player{position:fixed;z-index:11;left:14px;top:calc(62px + env(safe-area-inset-top,0px));max-width:60vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(8,8,12,.6);color:#fff;font:.85rem ui-monospace,Menlo,monospace;backdrop-filter:blur(8px)}
#ring,#dot{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-radius:50%}
#ring{width:34px;height:34px;border:2px solid var(--a);transition:width .15s,height .15s,background .15s}
#ring.hot{width:52px;height:52px;background:color-mix(in srgb,var(--a) 25%,transparent)}
#dot{width:6px;height:6px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;padding:10px 16px;border-radius:999px;background:rgba(8,8,12,.9);border:1px solid var(--a);font-size:.9rem;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#editor{position:fixed;left:0;right:0;bottom:0;z-index:20;height:min(62vh,600px);display:flex;flex-direction:column;background:rgba(10,10,15,.97);border-top:1px solid rgba(255,255,255,.15);transform:translateY(110%);transition:transform .3s}
#editor.open{transform:none}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid rgba(255,255,255,.1);overflow:auto;flex:none}
.tabs button{flex:none;padding:8px 12px;border:0;border-radius:6px;background:transparent;color:#9c9aae;font:inherit;font-size:.9rem}
.tabs button.on{background:var(--a);color:#fff}
.eb{flex:1;overflow:auto;padding:6px 16px 14px}
#editor label{display:block;margin:12px 0 5px;font-size:.82rem;color:#9c9aae}
#editor label.chk{display:flex;align-items:center;gap:8px;color:#e6e4f0;font-size:.92rem}
#editor input:not([type=checkbox]):not([type=range]):not([type=color]),#editor select,#editor textarea{width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:#14141c;color:#fff;font:inherit}
#editor textarea{min-height:90px}
#editor input[type=range]{width:100%}
#editor input[type=color]{width:100%;height:38px;border:0;background:none;padding:0}
.hint{font-size:.78rem;color:#8d8aa3;margin-top:4px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:6px;margin-bottom:10px}
.row .full{grid-column:1/-1}
.row .two{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sm{display:flex;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ib{display:grid;place-items:center;padding:0;height:42px}.ib svg,.ib img{width:24px;height:24px;object-fit:contain;fill:currentColor}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}.icg .btn{height:46px;padding:0;display:grid;place-items:center}.icg svg{width:24px;height:24px;fill:currentColor}
.stk{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;margin-top:12px}
.stk img{width:56px;height:56px;object-fit:cover;border-radius:4px}
.btn{padding:9px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:#1b1b26;color:#fff;font:inherit}
.btn.main{background:var(--a);border-color:var(--a)}
.ebar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1)}
#msg{flex:1;font-size:.8rem;color:#c9c6d6}
@media (prefers-reduced-motion:reduce){.gimg,.gs,#wm::before,#wm::after,#bio::after{animation:none}body.in nav a{animation:none}#editor,#toast{transition:none}}
</style></head>
<body>
<div id="bg"><video id="bv" muted loop playsinline autoplay hidden></video></div>
<canvas id="fx"></canvas>
<div id="crt"></div>
<div id="gate"><div class="gw"><div class="gcap"></div><img class="gimg" alt=""><div class="gs"></div></div></div>
<div id="stickers"></div>
<main id="card">
  <img id="ava" alt="">
  <div id="head"><h1 id="wm"></h1><p id="loc"></p><p id="bio"></p><div id="clock"></div></div>
  <nav id="links"></nav>
</main>
<button id="player" hidden></button>
<div id="toast"></div>
<button class="fab" id="share" aria-label="Share">⤴</button>
<div id="ring" hidden></div><div id="dot" hidden></div>
