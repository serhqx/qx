<!DOCTYPE html>
<html>
<head>
  <title>Free Virus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      cursor: pointer;
      user-select: none; /* Запрещаем выделение текста при частых кликах */
    }

    #main {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;

      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)),
        url("background.jpg") center/cover no-repeat;
    }

    /* Стили для общего счетчика кликов */
    #click-counter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none; /* Клики проходят сквозь плашку */
    }

    #counter-value {
      font-weight: bold;
      color: #00ff00; /* Зеленый цвет для цифр */
    }
  </style>
</head>

<body>

  <!-- Главный экран (только фон, весь текст убран) -->
  <div id="main"></div>

  <!-- Виджет общего счетчика -->
  <div id="click-counter">
    CLICKS: <span id="counter-value">Loading...</span>
  </div>

  <script>
    // Замени эту ссылку на свою из Firebase
    const dbUrl = "https://ТВОЙ_ПРОЕКТ_ИЗ_://firebaseio.com";

    const counterValue = document.getElementById("counter-value");
    let currentTotal = 0;

    // Функция получения кликов с сервера
    function fetchClicks() {
      fetch(dbUrl)
        .then(response => response.json())
        .then(data => {
          currentTotal = data !== null ? data : 0;
          counterValue.textContent = currentTotal;
        })
        .catch(err => console.error("Ошибка загрузки:", err));
    }

    // Первая загрузка при старте
    fetchClicks();

    // Обновляем базу каждые 2 секунды для синхронизации между всеми людьми
    setInterval(fetchClicks, 2000);

    // Клик в любом месте экрана
    document.body.onclick = function() {
      currentTotal++;
      counterValue.textContent = currentTotal;

      // Отправляем новый клик в онлайн-базу
      fetch(dbUrl, {
        method: 'PUT',
        body: JSON.stringify(currentTotal),
        headers: {
          'Content-Type': 'application/json'
        }
      }).catch(err => console.error("Ошибка отправки:", err));
    };
  </script>

</body>
</html>
