<!DOCTYPE html>
<html>
<head>
  <title>Free Virus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    #main {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;

      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)),
        url("background.jpg") center/cover no-repeat;
    }

    /* Стилі лічильника кліків */
    #click-counter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
    }

    #counter-value {
      font-weight: bold;
      color: #00ff00;
    }
  </style>
</head>

<body>

  <!-- Головний екран (тільки фон) -->
  <div id="main"></div>

  <!-- Віджет лічильника -->
  <div id="click-counter">
    CLICKS: <span id="counter-value">Loading...</span>
  </div>

  <script>
    // Унікальний ключ для твого сайту, щоб кліки не змішувалися з іншими сайтами
    // Можеш змінити "serh_cool_clicker_2026", якщо захочеш скинути лічильник на 0
    const siteKey = "serh_cool_clicker_2026";
    const dbUrl = `https://counterapi.dev{siteKey}`;

    const counterValue = document.getElementById("counter-value");
    let currentTotal = 0;

    // 1. Функція завантаження актуальних кліків з сервера
    function fetchClicks() {
      fetch(dbUrl)
        .then(response => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then(data => {
          currentTotal = data.value;
          counterValue.textContent = currentTotal;
        })
        .catch(() => {
          // Якщо ключ новий і його ще немає на сервері, створюємо його
          initCounter();
        });
    }

    // Функція для первинного створення лічильника на сервері
    function initCounter() {
      fetch(`${dbUrl}/set?value=0`)
        .then(() => { counterValue.textContent = 0; })
        .catch(err => console.error("Помилка сервера:", err));
    }

    // Завантажуємо дані відразу при відкритті сайту
    fetchClicks();

    // Кожні 2.5 секунди перевіряємо, чи не клікнув хтось інший
    setInterval(fetchClicks, 2500);

    // 2. Клік по екрану (збільшує лічильник в базі даних на +1)
    document.body.onclick = function() {
      // Оновлюємо на екрані моментально для швидкості
      currentTotal++;
      counterValue.textContent = currentTotal;

      // Надсилаємо команду серверу збільшити лічильник на 1
      fetch(`${dbUrl}/up`)
        .then(response => response.json())
        .then(data => {
          currentTotal = data.value;
          counterValue.textContent = currentTotal;
        })
        .catch(err => console.error("Не вдалося зберегти клік:", err));
    };
  </script>

</body>
</html>
